name: Solana tarama

on:
  schedule:
    # GitHub UTC kullanır. Ücretsiz planda cron birkaç dakika gecikebilir.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-tarama
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Test
        run: npm test

      - name: Önceki görüntüyü indir
        run: |
          curl -fsSL -A "PER-Sinyal-Action" \
            "https://raw.githubusercontent.com/${{ github.repository }}/data/snapshot.json" \
            -o /tmp/previous-snapshot.json \
            || echo "Önceki snapshot yok"

      - name: Tara
        run: npx tsx scripts/scan.ts
        env:
          SNAPSHOT_IN: /tmp/previous-snapshot.json
          SNAPSHOT_OUT: /tmp/snapshot.json

      - name: data dalına yaz
        run: |
          set -euo pipefail
          test -s /tmp/snapshot.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-publish
          git reset --quiet
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp /tmp/snapshot.json ./snapshot.json
          git add snapshot.json
          git commit -m "tarama: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin HEAD:data
