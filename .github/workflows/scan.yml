name: Solana tarama

on:
  schedule:
    # */5 bu repoda saatlerce atlandı. Bu tetik yalnızca uzun döngüyü başlatır.
    # GitHub geciktirse bile başlayan iş ~5,5 saat boyunca 3 dakikada bir tarar.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-tarama
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Test
        run: npm test

      - name: Önceki görüntüyü indir
        run: |
          curl -fsSL -A "PER-Sinyal-Action" \
            "https://raw.githubusercontent.com/${{ github.repository }}/data/snapshot.json" \
            -o /tmp/previous-snapshot.json \
          || curl -fsSL -A "PER-Sinyal-Action" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/snapshot.json?ref=data" \
            -o /tmp/previous-snapshot.json \
          || echo "Önceki snapshot yok"

      - name: Sürekli tara
        run: npx tsx scripts/keep-scanning.ts
        env:
          KEEP_MINUTES: "330"
          INTERVAL_SECONDS: "180"
